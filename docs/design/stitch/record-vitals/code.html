<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Yoma Care - Record vitals</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
    }
    /* Brand Deep Teal */
    .bg-teal-brand {
      background-color: #0E6569;
    }
    .text-teal-brand {
      color: #0E6569;
    }
    .border-teal-brand {
      border-color: #0E6569;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-50 text-slate-900 antialiased selection:bg-slate-200">
<!-- Container restricted to 360px viewport -->
<div class="w-full max-w-[360px] mx-auto min-h-screen flex flex-col relative bg-slate-50 pb-24 shadow-sm">
<!-- 1. Top bar: back arrow and title "Record vitals" -->
<header class="sticky top-0 z-20 bg-slate-50/95 backdrop-blur px-5 pt-5 pb-3 flex items-center gap-3 border-b border-slate-200/60">
<button aria-label="Back to Home" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-slate-800 hover:bg-slate-200/70 active:bg-slate-200 transition-colors" type="button">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.25" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-xl font-bold text-slate-900 tracking-tight">Record vitals</h1>
</header>
<!-- Main List of Seven Input Rows -->
<main class="flex-1 px-4 py-4 space-y-3">
<!-- Row 1: Systolic BP (mmHg) - Empty -->
<section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex flex-col gap-2">
<div class="flex items-center justify-between gap-3">
<label class="text-base font-semibold text-slate-800 leading-snug">
      Blood pressure
    </label>
<div class="flex items-center gap-1.5 bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 justify-end">
<div class="w-10 text-center text-lg font-bold text-slate-300 tracking-tight">—</div>
<span class="text-slate-400 font-semibold text-base">/</span>
<div class="w-10 text-center text-lg font-bold text-slate-300 tracking-tight">—</div>
<span class="text-xs font-semibold text-slate-500 ml-1">mmHg</span>
</div>
</div>
<div class="flex justify-end">
<button class="min-h-[48px] px-2 flex items-center text-xs font-semibold text-slate-500 underline underline-offset-2 hover:text-slate-700 active:text-slate-900" type="button">
      Not measured
    </button>
</div>
</section>
<!-- Row 2: Diastolic BP (mmHg) - Empty -->
<!-- Row 3: Heart rate (bpm) - Filled in: 96 -->
<section class="bg-white rounded-2xl p-4 shadow-sm border border-teal-brand/40 ring-1 ring-teal-brand/20 flex flex-col gap-2">
<div class="flex items-center justify-between gap-3">
<label class="text-base font-semibold text-slate-900 leading-snug">
            Heart rate
          </label>
<div class="flex items-baseline gap-1.5 bg-white border-2 border-teal-brand rounded-xl px-3.5 py-2.5 min-w-[124px] justify-end shadow-sm">
<span class="text-2xl font-bold text-slate-900 tracking-tight leading-none">96</span>
<span class="text-xs font-semibold text-slate-600">bpm</span>
</div>
</div>
<div class="flex justify-end pt-0.5">
<button class="min-h-[48px] px-2 flex items-center text-xs font-semibold text-slate-500 underline underline-offset-2 hover:text-slate-700 active:text-slate-900" type="button">
  Not measured
</button>
</div>
</section>
<!-- Row 4: Breathing rate (per min) - Marked "Not measured" (greyed out with small "Not measured" tag) -->
<section class="bg-slate-100/75 rounded-2xl p-4 shadow-none border border-slate-200 flex flex-col gap-2 opacity-85">
<div class="flex items-center justify-between gap-3">
<label class="text-base font-semibold text-slate-500 leading-snug">
            Breathing rate
          </label>
<div class="flex items-center justify-center bg-slate-200/90 border border-slate-300 rounded-xl px-3 py-2.5 min-w-[124px]">
<span class="text-xs font-bold text-slate-600 uppercase tracking-wider">Not measured</span>
</div>
</div>
<div class="flex justify-end pt-0.5">
<button class="min-h-[48px] px-2 flex items-center text-xs font-semibold text-slate-600 underline underline-offset-2 hover:text-slate-800" type="button">
  Clear
</button>
</div>
</section>
<!-- Row 5: Temperature (°C) - Empty -->
<section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex flex-col gap-2">
<div class="flex items-center justify-between gap-3">
<label class="text-base font-semibold text-slate-800 leading-snug">
            Temperature
          </label>
<div class="flex items-baseline gap-1.5 bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 min-w-[124px] justify-end">
<span class="text-xl font-bold text-slate-300 tracking-tight">—</span>
<span class="text-xs font-semibold text-slate-500">°C</span>
</div>
</div>
<div class="flex justify-end pt-0.5">
<button class="min-h-[48px] px-2 flex items-center text-xs font-semibold text-slate-500 underline underline-offset-2 hover:text-slate-700 active:text-slate-900" type="button">
  Not measured
</button>
</div>
</section>
<!-- Row 6: Oxygen saturation (%) with "(optional)" in grey - Empty -->
<section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex flex-col gap-2">
<div class="flex items-center justify-between gap-3">
<div class="flex flex-col">
<label class="text-base font-semibold text-slate-800 leading-snug">
              Oxygen saturation
            </label>
<span class="text-xs font-medium text-slate-500">(optional)</span>
</div>
<div class="flex items-baseline gap-1.5 bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 min-w-[124px] justify-end">
<span class="text-xl font-bold text-slate-300 tracking-tight">—</span>
<span class="text-xs font-semibold text-slate-500">%</span>
</div>
</div>
<div class="flex justify-end pt-0.5">
<button class="min-h-[48px] px-2 flex items-center text-xs font-semibold text-slate-500 underline underline-offset-2 hover:text-slate-700 active:text-slate-900" type="button">
  Not measured
</button>
</div>
</section>
<!-- Row 7: Consciousness: four large tap chips in a row: Alert, Voice, Pain, Unresponsive -->
<section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex flex-col gap-3"><div class="flex items-center justify-between">
<label class="text-base font-semibold text-slate-800 leading-snug">
    Consciousness
  </label>
</div>
<div class="grid grid-cols-2 gap-2 pt-1">
<button class="min-h-[52px] px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-800 font-semibold text-sm flex items-center justify-center text-center hover:bg-slate-50 active:bg-slate-100 transition-colors" type="button">
    Alert
  </button>
<button class="min-h-[52px] px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-800 font-semibold text-sm flex items-center justify-center text-center hover:bg-slate-50 active:bg-slate-100 transition-colors" type="button">
    Voice
  </button>
<button class="min-h-[52px] px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-800 font-semibold text-sm flex items-center justify-center text-center hover:bg-slate-50 active:bg-slate-100 transition-colors" type="button">
    Pain
  </button>
<button class="min-h-[52px] px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-800 font-semibold text-sm flex items-center justify-center text-center hover:bg-slate-50 active:bg-slate-100 transition-colors" type="button">
    Unresponsive
  </button>
</div>
<div class="flex justify-end">
<button class="min-h-[48px] px-2 flex items-center text-xs font-semibold text-slate-500 underline underline-offset-2 hover:text-slate-700 active:text-slate-900" type="button">
    Not measured
  </button>
</div></section>
</main>
<!-- 5. Full-width teal button fixed at the bottom: "See result" -->
<footer class="fixed bottom-0 left-0 right-0 z-30 bg-slate-50/95 backdrop-blur-md border-t border-slate-200/80 px-4 py-3 max-w-[360px] mx-auto">
<button class="w-full h-14 bg-slate-200 text-slate-500 cursor-not-allowed font-bold text-lg rounded-2xl shadow-none flex items-center justify-center tracking-wide" disabled="" type="button">
  See result – 4 left
</button>
</footer>
</div>
</body>
</html>
