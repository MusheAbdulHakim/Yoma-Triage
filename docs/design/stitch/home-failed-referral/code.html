<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Yoma Care</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#0D5C63',
            'brand-dark': '#0A494E',
            surface: '#FFFFFF',
            canvas: '#F8FAFC',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    };
  </script>
<style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F8FAFC;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-canvas text-slate-800 flex flex-col justify-between w-full h-full max-w-[360px] mx-auto p-4 box-border">
<!-- 1. Slim top bar -->
<header class="w-full flex items-center justify-between pt-1 pb-2 shrink-0">
<div class="flex flex-col">
<span class="text-sm font-bold text-slate-800 tracking-tight leading-tight">Yoma Care</span>
<span class="text-xs text-slate-700 font-medium leading-tight">Tamale South CHPS</span>
</div>
<div class="inline-flex items-center gap-1.5 bg-slate-200/90 text-slate-800 rounded-full px-2.5 py-1 text-xs font-semibold shrink-0">
<svg class="w-3.5 h-3.5 text-slate-700 stroke-[2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="m2 2 20 20"></path>
<path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"></path>
<path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07"></path>
</svg>
<span class="">Offline</span>
</div>
</header>
<!-- 2. Huge primary button (Emergency referral) -->
<div class="w-full mt-5 flex flex-col gap-3 shrink-0">
<button class="w-full h-[230px] bg-brand active:bg-brand-dark rounded-2xl shadow-sm shadow-teal-900/10 flex flex-col items-center justify-center gap-3 transition-transform active:scale-[0.99] text-center px-4" type="button">
<!-- White ambulance/emergency vehicle outline icon -->
<div class="w-14 h-14 rounded-full border-2 border-white/90 flex items-center justify-center text-white">
<svg class="w-8 h-8 stroke-[2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M10 17h4"></path>
<path d="M19 17h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-.6-1.4l-2.8-2.8A2 2 0 0 0 17.2 7H15V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"></path>
<circle cx="8" cy="17" r="2"></circle>
<circle cx="17" cy="17" r="2"></circle>
<path d="M8 7v4"></path>
<path d="M6 9h4"></path>
</svg>
</div>
<!-- Large bold white text -->
<span class="text-white text-[24px] font-bold tracking-tight leading-tight">
        Emergency referral
      </span>
</button>
<!-- Secondary full-width outlined button (Record vitals, 64px) -->
<button class="w-full h-[64px] bg-white border border-[#0D5C63]/30 active:bg-slate-50 rounded-2xl flex items-center justify-center gap-3 shadow-sm transition-transform active:scale-[0.99] px-4" type="button">
<!-- Heart-pulse icon in deep teal -->
<svg class="w-6 h-6 text-brand stroke-[2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
<path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"></path>
</svg>
<span class="text-brand text-[19px] font-semibold tracking-tight">
        Record vitals
      </span>
</button>
</div>
<!-- 4. Slim status strip at bottom -->
<div class="w-full bg-[#0f2744] rounded-xl px-3.5 py-3 flex items-center justify-between shadow-sm shrink-0 mb-1 mt-auto text-white cursor-pointer active:scale-[0.99] transition-transform">
<div class="flex items-center gap-2.5 min-w-0">
<svg class="w-4 h-4 text-white shrink-0 stroke-[2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<line x1="12" x2="12" y1="8" y2="12"></line>
<line x1="12" x2="12.01" y1="16" y2="16"></line>
</svg>
<span class="text-xs font-medium text-white truncate">1 referral failed to send – tap to call a driver</span>
</div>
<svg class="w-4 h-4 text-white shrink-0 stroke-[2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</div>
</body></html>
