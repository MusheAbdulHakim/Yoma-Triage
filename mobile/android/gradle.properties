org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Flutter DependencyVersionChecker reads this first; keep in sync with settings.gradle.kts.
kotlin_version=2.2.20
# Allow plugin modules (tflite_flutter) with mismatched Java/Kotlin JVM targets to compile.
kotlin.jvm.target.validation.mode=warning

# Mitigate flaky dl.google.com timeouts
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
