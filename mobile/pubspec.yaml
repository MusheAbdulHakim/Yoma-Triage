name: yoma_triage
description: Yoma Triage - Community Health Emergency Referral App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  sqflite: ^2.3.0
  path: ^1.9.0
  connectivity_plus: ^6.0.0
  uuid: ^4.5.0
  path_provider: ^2.1.0
  # Mic / TFLite on Android & iOS; Dart usage gated via conditional imports (web/stub).
  record: ^5.1.0
  tflite_flutter: ^0.11.0
  crypto: ^3.0.7
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.0

# record_linux 0.7.x breaks against record_platform_interface ≥1.5;
# pin so Android/iOS release builds compile (linux plugin unused on device).
dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
  assets:
    # Only the model the app uses. The OPERA-CE files in assets/models/ (the 16 MB ONNX
    # export and the encoder TFLite, which doesn't load on Android) stay in the repo for
    # scripts/spikes/export_opera_ce.py but are not bundled; OPERA-CE then reports
    # INCONCLUSIVE, "not included in this build".
    - assets/models/yamnet.tflite
    - assets/catalog/northern_bootstrap.json
    # Licence for the bundled font; registered with LicenseRegistry in main.dart.
    - assets/fonts/atkinson_hyperlegible_next/OFL.txt
  # Atkinson Hyperlegible Next (SIL OFL 1.1), bundled so it is never fetched at runtime.
  # Static instances cut from the upstream variable font; see docs/audit/UI_REDESIGN.md.
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
